# Current calibrated piano. Copy this file to create your own voicing.
# Unspecified settings use these defaults. Names are case-sensitive.
# Scale controls multiply existing pitch-dependent curves.

[hammer]
stiffness_scale = 0.90        # Felt stiffness: 0.25..4
mass_scale = 1.3             # Hammer mass: 0.5..2
felt_width_scale = 1.4       # Contact width: 0.5..2
maximum_velocity_mps = 6.0   # Hammer speed at velocity 1: 2..8 m/s
velocity_exponent = 1.8      # Speed response exponent: 0.75..2.5

[strings]
decay_scale = 1.10            # Late fundamental T60: 0.25..2
treble_decay_scale = 0.38   # Natural decay: 0.1..2; blends C6..F#6, full above
partial_loss_scale = 1.0     # Quadratic frequency-dependent loss: 0.25..4
inharmonicity_scale = 0.85    # String stiffness/inharmonicity: 0..3
unison_detune_scale = 0.35    # Unison detuning: 0..3
treble_unison_detune = 0.875  # Minimum treble unison detune: 0..3; blends G5..C6, full above
fast_decay_scale = 0.95       # Fast/slow decay ratio: 0.75..2, resulting ratio >=1
horizontal_ratio = 0.4      # Slow/fast polarization amplitude: 0..1
longitudinal_gain = 0.22    # Quadratic longitudinal coupling: 0..0.5 per newton
bridge_coupling = 1.0       # String-soundboard admittance coupling: 0..3

[tone]
# These two controls peak in A2-A3 and taper to zero at A1/A4.
fundamental_boost_db = 0.0  # -6..12 dB
lower_overtone_cut_db = 0.0 # 0..12 dB; overtones around 220-1000 Hz, tapered 160-2000
bridge_curve_scale = 1.0   # Existing bridge EQ depth: 0..2, register taper retained
# Additional bell EQ affects bridge output across all registers.
mid_gain_db = -1.5          # -9..9 dB; zero disables this bell
mid_frequency_hz = 1200.0 # 200..5000 Hz
mid_width_octaves = 0.9   # Gaussian standard deviation: 0.2..2 octaves

[soundboard]
bass_corner_hz = 70.0      # 30..250 Hz; lower retains more bass
treble_corner_hz = 3800.0  # 1500..10000 Hz
treble_slope = 1.8         # Rolloff exponent: 0.5..3
decay_scale = 1.10          # Modal decay and impulse length: 0.25..2
low_mode_density = 1.0    # 0 sparse, 1 dense (accepted); intermediate spacing allowed
ripple_fraction = 0.25     # Narrow modal ripple retained: 0..1
spread = 0.7               # Stereo spread of bridge regions: 0..1 (bass left, player's view)
position_depth = 0.5       # Bridge-position colouring of the board per region: 0..1

[resonance]
gain = 0.18                    # 0..1; zero is exact bypass
maximum_decay_seconds = 12.0   # Open sympathetic T60 cap: 1..30 s
damper_decay_seconds = 0.18    # Closed sympathetic T60: 0.03..2 s
transition_seconds = 0.04      # Damper transition: 0.001..0.2 s
own_drive = 0.0                # Share of a key's own force driving its own resonators: 0..1 (1 = old beating copy)

# App-owned room effect. These settings never enter piano.hpp.
[reverb]
mix = 0.3             # Wet level added to unchanged dry sound: 0..1; 0 disables
decay_seconds = 1.1    # Nominal low-frequency room T60: 0.2..4 s
predelay_ms = 12.0     # Delay before room response: 0..80 ms
damping_hz = 5500.0    # Feedback lowpass: 500..12000 Hz; lower gives darker tails
